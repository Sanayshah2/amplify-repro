version: 1
backend:
  phases:
    preBuild:
      commands:
        - |
          if [ ! -d amplify/backend/function/S3Trigger332680be/src/ ]; then
            mkdir -p amplify/backend/function/S3Trigger332680be/src/
          fi
    build:
      commands:
        - amplifyPush --simple

frontend:
  phases:
    preBuild:
      commands:
        - echo "frontend preBuild"
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
